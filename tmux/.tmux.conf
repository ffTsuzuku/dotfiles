# Unbind default prefix
unbind C-b

# Set new prefix to backtick `
set -g prefix `

# Make prefix + prefix send literal `
bind ` send-prefix
##### GENERAL SETTINGS #####
set -g mouse on
set -g history-limit 10000
set -sg escape-time 10
set -g status-interval 2
set -g base-index 1
setw -g pane-base-index 1
set -g status-position top

##### COLOR PALETTE (Gruvbox Dark) #####
set -g @gxb_bg      "#1d2021"
set -g @gxb_bg2     "#282828"
set -g @gxb_fg      "#ebdbb2"
set -g @gxb_yellow  "#d79921"
set -g @gxb_orange  "#d65d0e"
set -g @gxb_aqua    "#689d6a"
set -g @gxb_blue    "#458588"
set -g @gxb_red     "#cc241d"

##### STATUS BAR #####
set -g status on
set -g status-style "bg=#{@gxb_bg},fg=#{@gxb_fg}"

# Left side: Session name
set -g status-left-length 40
set -g status-left "#[fg=#{@gxb_yellow},bg=#{@gxb_bg},bold] #S #[fg=#{@gxb_bg},bg=#{@gxb_bg2}]"

# Window list
setw -g window-status-format "#[fg=#{@gxb_fg},bg=#{@gxb_bg2}] #I:#W "
setw -g window-status-current-format "#[bg=#{@gxb_aqua},fg=#{@gxb_bg},bold] #I:#W #[fg=#{@gxb_aqua},bg=#{@gxb_bg2}]"

##### STATUS RIGHT #####
set -g status-right-length 80
set -g status-right "#{?client_prefix,#[fg=#{@gxb_red}] #[fg=#{@gxb_fg}],} #[fg=#{@gxb_blue}]%Y-%m-%d #[fg=#{@gxb_orange}]%H:%M "

##### PANE STYLING #####
# Active pane border
set -g pane-active-border-style "fg=#{@gxb_aqua}"

# Inactive pane border
set -g pane-border-style "fg=#{@gxb_bg2}"

# Pane background
set -g window-style "bg=#{@gxb_bg2}"
set -g window-active-style "bg=#{@gxb_bg}"

##### MESSAGE / POPUP COLORS #####
set -g message-style "bg=#{@gxb_blue},fg=#{@gxb_bg}"
set -g message-command-style "bg=#{@gxb_blue},fg=#{@gxb_bg}"

##### SPLIT DIRECTION OVERRIDES (optional) #####
# Make splits open above/left by default (Gruvbox looks nice with symmetry)
bind - split-window -v -b
bind | split-window -h -b

##### VI MODE #####
setw -g mode-keys vi
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection-and-cancel

##### FIX CLIPBOARD FOR MACOS #####
# Copies to system clipboard
bind C-c run "tmux save-buffer - | pbcopy"
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
